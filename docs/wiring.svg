<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1140" width="1700" height="1140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700">
  <!-- Φόντο / background -->
  <rect width="1700" height="1140" fill="#ffffff"/>
  <g fill="#eaf3fb">
    <polygon points="120,960 420,80 560,80 260,960"/>
    <polygon points="1180,960 1480,80 1620,80 1320,960"/>
    <polygon points="700,960 1000,80 1060,80 760,960" opacity="0.6"/>
  </g>

  <!-- ===================================================== ESP32-C3 -->
  <g>
    <rect x="270" y="170" width="340" height="550" rx="14" fill="#2b2b2b"/>
    <!-- USB-C -->
    <rect x="370" y="115" width="140" height="125" rx="14" fill="#d6d6d6" stroke="#bdbdbd" stroke-width="3"/>
    <g stroke="#9e9e9e" stroke-width="3">
      <line x1="392" y1="200" x2="392" y2="232"/><line x1="408" y1="200" x2="408" y2="232"/>
      <line x1="424" y1="200" x2="424" y2="232"/><line x1="440" y1="200" x2="440" y2="232"/>
      <line x1="456" y1="200" x2="456" y2="232"/><line x1="472" y1="200" x2="472" y2="232"/>
      <line x1="488" y1="200" x2="488" y2="232"/>
    </g>
    <!-- BOOT / RESET -->
    <rect x="378" y="270" width="48" height="48" rx="6" fill="#e0e0e0"/><circle cx="402" cy="294" r="13" fill="#333"/>
    <rect x="456" y="270" width="48" height="48" rx="6" fill="#e0e0e0"/><circle cx="480" cy="294" r="13" fill="#333"/>
    <text x="402" y="338" font-size="12" fill="#ddd" text-anchor="middle">BOOT</text>
    <text x="480" y="338" font-size="12" fill="#ddd" text-anchor="middle">RESET</text>
    <!-- Chip -->
    <rect x="395" y="425" width="90" height="90" rx="6" fill="#4a4a4a" stroke="#666" stroke-width="2" transform="rotate(45 440 470)"/>
    <text x="440" y="476" font-size="13" fill="#bbb" text-anchor="middle" transform="rotate(-35 440 470)">ESPRESSIF</text>
    <rect x="340" y="560" width="46" height="36" rx="4" fill="#cfc29a"/>
    <!-- C3 -->
    <rect x="390" y="650" width="100" height="44" rx="4" fill="#a32a1c"/>
    <rect x="390" y="650" width="16" height="44" fill="#ccc"/><rect x="474" y="650" width="16" height="44" fill="#ccc"/>
    <text x="440" y="681" font-size="24" fill="#fff" text-anchor="middle">C3</text>

    <!-- Pads -->
    <g fill="#f4d03f">
      <rect x="578" y="237" width="28" height="26" rx="5"/><rect x="578" y="297" width="28" height="26" rx="5"/>
      <rect x="578" y="357" width="28" height="26" rx="5"/><rect x="578" y="417" width="28" height="26" rx="5"/>
      <rect x="578" y="477" width="28" height="26" rx="5"/><rect x="578" y="537" width="28" height="26" rx="5"/>
      <rect x="578" y="597" width="28" height="26" rx="5"/><rect x="578" y="657" width="28" height="26" rx="5"/>
      <rect x="274" y="237" width="28" height="26" rx="5"/><rect x="274" y="297" width="28" height="26" rx="5"/>
      <rect x="274" y="357" width="28" height="26" rx="5"/><rect x="274" y="417" width="28" height="26" rx="5"/>
      <rect x="274" y="477" width="28" height="26" rx="5"/><rect x="274" y="537" width="28" height="26" rx="5"/>
      <rect x="274" y="597" width="28" height="26" rx="5"/><rect x="274" y="657" width="28" height="26" rx="5"/>
    </g>
    <g fill="#2b2b2b">
      <circle cx="592" cy="250" r="6"/><circle cx="592" cy="310" r="6"/><circle cx="592" cy="370" r="6"/><circle cx="592" cy="430" r="6"/>
      <circle cx="592" cy="490" r="6"/><circle cx="592" cy="550" r="6"/><circle cx="592" cy="610" r="6"/><circle cx="592" cy="670" r="6"/>
      <circle cx="288" cy="250" r="6"/><circle cx="288" cy="310" r="6"/><circle cx="288" cy="370" r="6"/><circle cx="288" cy="430" r="6"/>
      <circle cx="288" cy="490" r="6"/><circle cx="288" cy="550" r="6"/><circle cx="288" cy="610" r="6"/><circle cx="288" cy="670" r="6"/>
    </g>

    <!-- Ετικέτες ακροδεκτών / pin labels -->
    <g font-size="17" text-anchor="end">
      <text x="568" y="256" fill="#8a8a8a">5V</text>
      <text x="568" y="316" fill="#fff">GND</text>
      <text x="568" y="376" fill="#fff">3V3</text>
      <text x="568" y="436" fill="#8a8a8a">GPIO4</text>
      <text x="568" y="496" fill="#8a8a8a">GPIO3</text>
      <text x="568" y="556" fill="#fff">GPIO2</text>
      <text x="568" y="616" fill="#8a8a8a">GPIO1</text>
      <text x="568" y="676" fill="#fff">GPIO0</text>
    </g>
    <g font-size="17">
      <text x="312" y="256" fill="#8a8a8a">GPIO5</text>
      <text x="312" y="316" fill="#8a8a8a">GPIO6</text>
      <text x="312" y="376" fill="#8a8a8a">GPIO7</text>
      <text x="312" y="436" fill="#8a8a8a">GPIO8</text>
      <text x="312" y="496" fill="#8a8a8a">GPIO9</text>
      <text x="312" y="556" fill="#8a8a8a">GPIO10</text>
      <text x="312" y="616" fill="#fff">GPIO20</text>
      <text x="312" y="676" fill="#fff">GPIO21</text>
    </g>
    <text x="440" y="790" font-size="26" fill="#222" text-anchor="middle">ESP32-C3 Super Mini</text>
    <text x="440" y="100" font-size="17" fill="#555" text-anchor="middle">USB-C → τροφοδοσία / power</text>
  </g>

  <!-- ===================================================== ΚΑΛΩΔΙΑ / WIRES -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
    <!-- GND -->
    <path d="M606,310 L680,310" stroke="#111"/>
    <path d="M850,250 L680,250 L680,800 L900,800 L1000,800" stroke="#111"/>
    <!-- 3V3 (με γέφυρα πάνω από το GND) -->
    <path d="M606,370 L670,370 A10,10 0 0 1 690,370 L720,370"  stroke="#e53935"/>
    <path d="M850,330 L720,330 L720,560 L900,560" stroke="#e53935"/>
    <!-- GPIO2 <- ZMPT OUT -->
    <path d="M606,550 L670,550 A10,10 0 0 1 690,550 L710,550 A10,10 0 0 1 730,550 L790,550 L790,410 L850,410" stroke="#a0703c"/>
    <!-- GPIO0 <- SCT-013 -->
    <path d="M606,670 L640,670 L640,880 L1220,880" stroke="#a0703c"/>
    <!-- Bias 1.65V -->
    <path d="M900,680 L1220,680" stroke="#1fa39a"/>
    <!-- UART (προαιρετικό) -->
    <g stroke="#9e9e9e" stroke-dasharray="12 9">
      <path d="M190,610 L274,610"/>
      <path d="M190,670 L274,670"/>
      <path d="M190,730 L232,730"/>
    </g>
  </g>
  <!-- Κόμβοι / junctions -->
  <g fill="#111"><circle cx="680" cy="310" r="9"/><circle cx="900" cy="800" r="9"/></g>
  <g fill="#e53935"><circle cx="720" cy="370" r="9"/></g>
  <g fill="#1fa39a"><circle cx="900" cy="680" r="9"/><circle cx="1000" cy="680" r="9"/></g>
  <!-- Χρωματιστές τελείες στους ακροδέκτες / pin dots -->
  <circle cx="626" cy="310" r="11" fill="#111"/>
  <circle cx="626" cy="370" r="11" fill="#e53935"/>
  <circle cx="626" cy="550" r="11" fill="#a0703c"/>
  <circle cx="626" cy="670" r="11" fill="#a0703c"/>
  <circle cx="254" cy="610" r="11" fill="#9e9e9e"/>
  <circle cx="254" cy="670" r="11" fill="#9e9e9e"/>

  <!-- ===================================================== ZMPT101B -->
  <text x="1000" y="180" font-size="22" fill="#222" text-anchor="middle">ZMPT101B</text>
  <text x="1000" y="203" font-size="15" fill="#666" text-anchor="middle" font-weight="400">αισθητήρας τάσης / voltage sensor</text>
  <rect x="850" y="218" width="300" height="242" rx="12" fill="#1565c0"/>
  <g fill="#f4d03f">
    <rect x="850" y="238" width="22" height="24" rx="4"/><rect x="850" y="318" width="22" height="24" rx="4"/><rect x="850" y="398" width="22" height="24" rx="4"/>
  </g>
  <g font-size="16" fill="#fff">
    <text x="882" y="256">GND</text><text x="882" y="336">VCC</text><text x="882" y="416">OUT</text>
  </g>
  <rect x="965" y="250" width="100" height="110" rx="6" fill="#1b1b1b"/>
  <text x="1015" y="300" font-size="13" fill="#bbb" text-anchor="middle">ZMPT</text>
  <text x="1015" y="318" font-size="13" fill="#bbb" text-anchor="middle">101B</text>
  <rect x="975" y="385" width="34" height="34" rx="4" fill="#64b5f6"/><circle cx="992" cy="402" r="9" fill="#fff"/>
  <text x="1030" y="408" font-size="12" fill="#cfe3ff" font-weight="400">ρύθμιση</text>
  <rect x="1100" y="270" width="50" height="120" rx="4" fill="#2e7d32"/>
  <circle cx="1125" cy="300" r="12" fill="#cfd8dc"/><circle cx="1125" cy="360" r="12" fill="#cfd8dc"/>
  <!-- Δίκτυο 230V -->
  <path d="M1150,300 L1300,300" stroke="#8d4a14" stroke-width="7" fill="none"/>
  <path d="M1150,360 L1300,360" stroke="#1e88e5" stroke-width="7" fill="none"/>
  <text x="1225" y="290" font-size="17" fill="#8d4a14" text-anchor="middle">L</text>
  <text x="1225" y="384" font-size="17" fill="#1e88e5" text-anchor="middle">N</text>
  <rect x="1300" y="260" width="230" height="140" rx="12" fill="#fff4e5" stroke="#ff6f00" stroke-width="4"/>
  <text x="1415" y="315" font-size="34" fill="#e65100" text-anchor="middle">⚡ 230V AC</text>
  <text x="1415" y="350" font-size="16" fill="#e65100" text-anchor="middle">ΠΡΟΣΟΧΗ / DANGER</text>
  <text x="1415" y="375" font-size="13" fill="#e65100" text-anchor="middle" font-weight="400">πρίζα ή πίνακας / mains</text>

  <!-- ===================================================== ΔΙΑΙΡΕΤΗΣ / BIAS DIVIDER -->
  <g fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round">
    <path d="M900,560 L900,590 l13,5 l-26,10 l26,10 l-26,10 l26,10 l-26,10 l13,5 L900,680"/>
    <path d="M900,680 L900,710 l13,5 l-26,10 l26,10 l-26,10 l26,10 l-26,10 l13,5 L900,800"/>
    <path d="M1000,680 L1000,733 M978,733 L1022,733 M978,747 L1022,747 M1000,747 L1000,800"/>
  </g>
  <circle cx="900" cy="560" r="9" fill="#e53935"/>
  <g font-size="17" fill="#222">
    <text x="845" y="625" text-anchor="end">R1</text><text x="845" y="645" text-anchor="end" fill="#666" font-weight="400">10kΩ</text>
    <text x="845" y="745" text-anchor="end">R2</text><text x="845" y="765" text-anchor="end" fill="#666" font-weight="400">10kΩ</text>
    <text x="1032" y="738">C</text><text x="1032" y="758" fill="#666" font-weight="400">10µF</text>
    <text x="984" y="728" font-size="16">+</text>
  </g>
  <text x="1110" y="668" font-size="16" fill="#1fa39a" text-anchor="middle">1.65V bias</text>
  <text x="900" y="545" font-size="15" fill="#666" text-anchor="middle" font-weight="400">διαιρέτης / divider</text>

  <!-- ===================================================== SCT-013 -->
  <text x="1290" y="610" font-size="22" fill="#222" text-anchor="middle">SCT-013-030</text>
  <text x="1290" y="633" font-size="15" fill="#666" text-anchor="middle" font-weight="400">αισθητήρας ρεύματος / current clamp</text>
  <rect x="1220" y="650" width="140" height="260" rx="12" fill="#262626"/>
  <g fill="#f4d03f"><rect x="1220" y="668" width="22" height="24" rx="4"/><rect x="1220" y="868" width="22" height="24" rx="4"/></g>
  <text x="1252" y="686" font-size="14" fill="#fff">sleeve</text>
  <text x="1252" y="886" font-size="14" fill="#fff">tip</text>
  <text x="1290" y="770" font-size="18" fill="#fff" text-anchor="middle">30A</text>
  <text x="1290" y="795" font-size="18" fill="#fff" text-anchor="middle">1V</text>
  <text x="1290" y="830" font-size="12" fill="#aaa" text-anchor="middle" font-weight="400">βύσμα 3.5mm</text>
  <path d="M1360,780 C1400,780 1400,780 1425,780" stroke="#262626" stroke-width="10" fill="none"/>
  <!-- Καλώδιο φάσης μέσα από τη δαγκάνα -->
  <path d="M1490,650 L1490,930" stroke="#8d4a14" stroke-width="10" fill="none"/>
  <path d="M1490,700 m-12,0 l12,-16 l12,16" stroke="#8d4a14" stroke-width="5" fill="none" transform="rotate(180 1490 700)"/>
  <circle cx="1490" cy="780" r="60" fill="none" stroke="#262626" stroke-width="24" stroke-dasharray="340 37.7" transform="rotate(-80 1490 780)"/>
  <text x="1490" y="958" font-size="16" fill="#8d4a14" text-anchor="middle">μόνο η φάση L / live wire only</text>
  <text x="1565" y="785" font-size="14" fill="#666" font-weight="400">→ φορτίο</text>
  <text x="1565" y="803" font-size="14" fill="#666" font-weight="400">load</text>

  <!-- ===================================================== USB-TTL -->
  <text x="115" y="550" font-size="19" fill="#222" text-anchor="middle">USB-TTL</text>
  <text x="115" y="572" font-size="14" fill="#666" text-anchor="middle" font-weight="400">προαιρετικό / optional</text>
  <rect x="40" y="585" width="150" height="175" rx="12" fill="#6a1b9a"/>
  <g fill="#f4d03f"><rect x="168" y="598" width="22" height="24" rx="4"/><rect x="168" y="658" width="22" height="24" rx="4"/><rect x="168" y="718" width="22" height="24" rx="4"/></g>
  <g font-size="16" fill="#fff" text-anchor="end"><text x="160" y="616">TX</text><text x="160" y="676">RX</text><text x="160" y="736">GND</text></g>
  <text x="238" y="736" font-size="14" fill="#777">→ GND</text>

  <!-- ===================================================== ΥΠΟΜΝΗΜΑ / LEGEND -->
  <g font-size="22" fill="#222">
    <circle cx="140" cy="1000" r="13" fill="#e53935"/><text x="162" y="1008">3V3</text>
    <circle cx="270" cy="1000" r="13" fill="#111"/><text x="292" y="1008">GND</text>
    <circle cx="410" cy="1000" r="13" fill="#a0703c"/><text x="432" y="1008">ANALOG</text>
    <circle cx="590" cy="1000" r="13" fill="#1fa39a"/><text x="612" y="1008">BIAS 1.65V</text>
    <circle cx="800" cy="1000" r="13" fill="#9e9e9e"/><text x="822" y="1008">UART</text>
    <circle cx="935" cy="1000" r="13" fill="#8d4a14"/><text x="957" y="1008">L (φάση)</text>
    <circle cx="1110" cy="1000" r="13" fill="#1e88e5"/><text x="1132" y="1008">N (ουδέτερος)</text>
    <circle cx="1340" cy="1000" r="13" fill="#ff6f00"/><text x="1362" y="1008">230V AC</text>
  </g>
  <text x="850" y="1080" font-size="58" fill="#111" text-anchor="middle" font-weight="900">ESP32-C3 Smart Meter</text>
  <text x="850" y="1118" font-size="22" fill="#666" text-anchor="middle" font-weight="400">Σχηματικό σύνδεσης · Wiring diagram</text>
</svg>
